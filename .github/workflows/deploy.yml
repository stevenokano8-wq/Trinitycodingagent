name: CI/CD Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Node 22 — no cache: project uses bun.lock and the preinstall script
      # removes package-lock.json, so npm cache won't have a lock file to key on.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      # Frontend type-check only (vite.config.ts + src/**).
      # Server files are excluded from tsconfig.json; Wrangler compiles the
      # Worker with its own bundler so a separate server tsc step isn't needed.
      - name: Type-check Frontend
        run: npx tsc -p tsconfig.json --noEmit
        continue-on-error: true   # don't block deploy on type warnings

      - name: Build Frontend (Vite)
        run: npx vite build
        env:
          NODE_ENV: production

      # Only deploy on pushes to main (not PRs)
      - name: Deploy Frontend Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy --config wrangler.frontend.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
